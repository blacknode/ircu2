name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tests/**'
      - 'doc/**'
      - 'patches/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'tests/**'
      - 'doc/**'
      - 'patches/**'
      - '*.md'

jobs:
  build:
    name: ${{ matrix.tls }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        tls: [openssl, gnutls, none]
        build_type: [RelWithDebInfo]
        include:
          # One debug configuration to keep DEBUGMODE compiling.
          - tls: openssl
            build_type: Debug

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build bison pkg-config
          if [ "${{ matrix.tls }}" = "openssl" ]; then
            sudo apt-get install -y libssl-dev
          elif [ "${{ matrix.tls }}" = "gnutls" ]; then
            sudo apt-get install -y libgnutls28-dev
          fi

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DIRCU_TLS=${{ matrix.tls }}
          -DIRCU_DOMAIN=example.com
          -DIRCU_ENABLE_WARNINGS=ON
          ${{ matrix.build_type == 'Debug' && '-DIRCU_ENABLE_DEBUG=ON' || '' }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test the server binary
        run: ./build/ircd/ircd -v

      - name: Check the example modules built and resolve only core symbols
        run: |
          set -e
          # Modules mirror the source tree: build/modules/<type>/<name>.so,
          # or <type>/<name>/<name>.so for one built from a directory.
          test -n "$(find build/modules -mindepth 2 -name '*.so')"
          for so in $(find build/modules -mindepth 2 -name '*.so' | sort); do
            echo "== $so"
            test -f "$so"
            # Anything a module needs that the ircd does not export would
            # fail at dlopen with RTLD_NOW, so catch it here instead.
            undefined=$(nm -u "$so" | awk '{print $NF}' | grep -v '^_' || true)
            for sym in $undefined; do
              if ! nm -D build/ircd/ircd | awk '{print $NF}' | grep -qx "$sym"                  && ! nm -D --undefined-only build/ircd/ircd | awk '{print $NF}' | grep -qx "$sym"; then
                echo "  $sym is not exported by the ircd or its libraries"
              fi
            done
          done
