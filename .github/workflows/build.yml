name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tests/**'
      - 'doc/**'
      - 'patches/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'tests/**'
      - 'doc/**'
      - 'patches/**'
      - '*.md'

jobs:
  build:
    name: ${{ matrix.tls }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        tls: [openssl, gnutls, none]
        build_type: [RelWithDebInfo]
        include:
          # One debug configuration to keep DEBUGMODE compiling.
          - tls: openssl
            build_type: Debug

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build bison pkg-config
          # libpq and jansson are not the ircd's dependencies; they belong
          # to modules/workers/postgres and modules/services/identity, which
          # declare them in their own CMake fragments and are skipped when
          # they are missing.  Installed here so that CI compiles them
          # rather than silently skipping them.
          sudo apt-get install -y libpq-dev libjansson-dev
          if [ "${{ matrix.tls }}" = "openssl" ]; then
            sudo apt-get install -y libssl-dev
          elif [ "${{ matrix.tls }}" = "gnutls" ]; then
            sudo apt-get install -y libgnutls28-dev
          fi

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DIRCU_TLS=${{ matrix.tls }}
          -DIRCU_DOMAIN=example.com
          -DIRCU_ENABLE_WARNINGS=ON
          ${{ matrix.build_type == 'Debug' && '-DIRCU_ENABLE_DEBUG=ON' || '' }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test the server binary
        run: ./build/ircd/ircd -v

      - name: Check the example modules built and resolve only core symbols
        run: |
          set -e
          # Modules mirror the source tree: build/modules/<type>/<name>.so,
          # or <type>/<name>/<name>.so for one built from a directory.
          test -n "$(find build/modules -mindepth 2 -name '*.so')"

          # The postgres module needs libpq and jansson and the identity
          # module needs jansson, both installed above; a skipped module
          # here means its dependencies went missing.
          test -f build/modules/workers/postgres/postgres.so
          test -f build/modules/services/identity/identity.so

          # The history and richtext modules need nothing beyond the core,
          # so they are never skipped; if one is missing, the build is what
          # went wrong.
          test -f build/modules/services/history/history.so
          test -f build/modules/hooks/richtext.so

          # The host an isolated module runs in, and the reference module
          # that runs in it.  Neither needs anything beyond the core.
          test -x build/ircd/ircu-modhost
          test -f build/modules/commands/isolated_demo.so

          # An isolated module resolves its symbols against ircu-modhost,
          # exactly as a native one does against the ircd.  If the
          # reference module cannot, the profile in
          # ircd/modhost/modhost_api.c has lost something.
          hostsyms=$(mktemp)
          nm -D --defined-only build/ircd/ircu-modhost | awk '{print $NF}' \
            | sed 's/@.*//' | sort -u > "$hostsyms"
          for sym in $(nm -u build/modules/commands/isolated_demo.so \
                       | awk '{print $NF}' | sed 's/@.*//' \
                       | grep -v '^_' | grep -v GLIBC || true); do
            if ! grep -qx "$sym" "$hostsyms"; then
              echo "  isolated_demo needs $sym, which ircu-modhost does not have"
              exit 1
            fi
          done
          rm -f "$hostsyms"

          missing=0
          for so in $(find build/modules -mindepth 2 -name '*.so' | sort); do
            echo "== $so"
            test -f "$so"

            # What the module may resolve against: the ircd's own exports,
            # the symbols the ircd itself imports from its libraries, and --
            # for a module with dependencies of its own, declared in its
            # module.cmake -- whatever those libraries define.  Symbol
            # versions ("@GLIBC_2.17") are not part of the name.
            allowed=$(mktemp)
            nm -D build/ircd/ircd | awk '{print $NF}' > "$allowed"
            nm -D --undefined-only build/ircd/ircd | awk '{print $NF}' >> "$allowed"
            for lib in $(ldd "$so" | awk '/=>/ && $3 ~ /^\// {print $3}'); do
              nm -D --defined-only "$lib" 2>/dev/null | awk '{print $NF}' >> "$allowed"
            done
            sed -i 's/@.*//' "$allowed"
            sort -u -o "$allowed" "$allowed"

            # Anything left over would fail at dlopen with RTLD_NOW, so catch
            # it here instead.
            for sym in $(nm -u "$so" | awk '{print $NF}' | sed 's/@.*//' | grep -v '^_' || true); do
              if ! grep -qx "$sym" "$allowed"; then
                echo "  $sym is not exported by the ircd and not provided by"
                echo "  any library the module links against"
                missing=1
              fi
            done
            rm -f "$allowed"
          done
          test "$missing" -eq 0
