# The identity topology: one server with the identity module and the
# PostgreSQL it stores accounts in.  See doc/readme.sasl and
# tests/identity_db/.
#
# Not part of the hub/leaf network: what is tested here is one server
# answering for itself, and the store is per-topology so a run cannot
# inherit accounts from another one.

General {
        name = "identity.test.net";
        vhost = "0.0.0.0";
        description = "Identity Test Server";
        numeric = 7;
};

Security {
        virtual_host_key = "AbCdEfGhIjKl";
};

Admin {
        Location = "Test Network";
        Location = "Identity Server";
        Contact = "test@test.net";
};

Class {
        name = "Server";
        pingfreq = 90 seconds;
        connectfreq = 5 minutes;
        sendq = 9 megabytes;
        maxlinks = 10;
};

Connect {
        name = "services.test.net";
        host = "10.55.0.1";
        password = "testpass";
        class = "Server";
        hub;
};

UWorld {
        oper = "services.test.net";
};

# maxflood above the CLIENT_FLOOD default (1024) makes the class exempt
# from input throttling, the same way tests/docker/ircd-hub.conf does it.
# tests/history/ posts more messages in a row than the two-seconds-a-line
# allowance lets through, and what it is testing is the store rather than
# the flood control.
Class {
        name = "Local";
        pingfreq = 1 minutes 30 seconds;
        sendq = 160000;
        maxflood = 262144;
        maxlinks = 100;
};

Client { ip = "*"; class = "Local"; maxlinks = 200; };

Operator {
        local = no;
        class = "Local";
        host = "*@*";
        password = "$PLAIN$operpass";
        name = "testoper";
        set = yes;
        wide_gline = yes;
        # /MODULE MIGRATION APPLY identity is how the schema gets there;
        # the tests do it once, which also exercises the migration path.
        module_admin = yes;
# HISTORY EXPORT / FORGET read and delete other people's messages, so
# the privilege is separate and granted here on purpose.
        history_admin = yes;
};

# The identity module reads this and nothing else about the database.
Database {
        dsn = "host=10.55.0.50 port=5432 user=ircu password=ircu dbname=ircu";
        pool = 2;
};

# No Redis{} block on purpose: the cache is never the truth, so a server
# without one answers exactly the same, only slower.  See
# doc/readme.cache.

Module { name = "postgres"; };
Module { name = "identity"; };
Module { name = "irc_services"; };
# tests/history/ reads back what this one stored.
Module { name = "history"; };

Service {
        name = "NickServ";
        type = "nickserv";
        # Short enough that a test can wait for it, long enough that the
        # database has time to answer first.
        "grace_period" = 10;
        "max_accounts" = 2;
};

Port { server = yes; port = 4430; };
Port { port = 6673; };

Features {
        "HUB" = "TRUE";
        "NODNS" = "TRUE";
        "CONFIG_OPERCMDS" = "TRUE";
# Argon2 belongs on a worker; with no pool the module refuses every
# verification, which is the documented behaviour but not what is being
# tested here.
        "WORKER_THREADS" = "4";
# The test port is plain, so the password would cross it in the clear.
# Turned off knowingly, which is the only way it is ever off.
        "ACCOUNT_REQUIRE_TLS" = "FALSE";
        "IPCHECK_CLONE_LIMIT" = "1000";
        "IPCHECK_CLONE_PERIOD" = "1";
        "PINGFREQUENCY" = "3";
# One server, so there is nothing for msgid and time to cross; they are on
# anyway so that what the tests see is what a real network sees.
        "NETWORK_FEATURES" = "TRUE";
        "NETWORK_TIME" = "TRUE";
        "HISTORY_MAX_LIMIT" = "20";
        "HISTORY_EXPORT_DIR" = "/opt/ircu/lib/export";
};
