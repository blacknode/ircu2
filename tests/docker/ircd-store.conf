# The store topology: one server with a database behind it, for the
# modules that keep what they hear -- history, the conversation model and
# the file host.  See tests/history/, tests/conversation/, tests/files/.
#
# Not part of the hub/leaf network: what is tested here is one server
# answering for itself, and the store is per-topology so a run cannot
# inherit rows from another one.
#
# Accounts come from the network's services, as they do everywhere else:
# tests/p10_server.py links as services.test.net and sends ACCOUNT.  See
# doc/readme.accounting.

General {
        name = "store.test.net";
        vhost = "0.0.0.0";
        description = "Store Test Server";
        numeric = 7;
};

Security {
        virtual_host_key = "AbCdEfGhIjKl";
};

Admin {
        Location = "Test Network";
        Location = "Store Server";
        Contact = "test@test.net";
};

Class {
        name = "Server";
        pingfreq = 90 seconds;
        connectfreq = 5 minutes;
        sendq = 9 megabytes;
        maxlinks = 10;
};

Connect {
        name = "services.test.net";
        host = "10.55.0.1";
        password = "testpass";
        class = "Server";
        hub;
};

UWorld {
        name = "services.test.net";
};

# maxflood above the CLIENT_FLOOD default (1024) makes the class exempt
# from input throttling, the same way tests/docker/ircd-hub.conf does it.
# tests/history/ posts more messages in a row than the two-seconds-a-line
# allowance lets through, and what it is testing is the store rather than
# the flood control.
Class {
        name = "Local";
        pingfreq = 1 minutes 30 seconds;
        sendq = 160000;
        maxflood = 262144;
        maxlinks = 100;
};

Client { ip = "*"; class = "Local"; maxlinks = 200; };

Operator {
        local = no;
        class = "Local";
        host = "*@*";
        password = "$PLAIN$operpass";
        name = "testoper";
        set = yes;
        wide_gline = yes;
        # /MODULE MIGRATION APPLY <module> is how a schema gets there;
        # the tests do it once, which also exercises the migration path.
        module_admin = yes;
# HISTORY EXPORT / FORGET read and delete other people's messages, so
# the privilege is separate and granted here on purpose.
        history_admin = yes;
};

# What the modules that keep things read, and nothing else about it.
Database {
        dsn = "host=10.55.0.50 port=5432 user=ircu password=ircu dbname=ircu";
        pool = 2;
};

# No Redis{} block on purpose: the cache is never the truth, so a server
# without one answers exactly the same, only slower.  See
# doc/readme.cache.

Module { name = "postgres"; };
Module { name = "filehost"; };
# tests/history/ reads back what this one stored.
Module { name = "history"; };
# tests/conversation/ exercises the rich text this one adds.
Module { name = "richtext"; };

Port { server = yes; port = 4430; };
Port { port = 6673; };

Features {
        "HUB" = "TRUE";
        "NODNS" = "TRUE";
        "CONFIG_OPERCMDS" = "TRUE";
# The postgres driver is one dedicated worker per pooled connection, so
# with no pool there is no database at all.
        "WORKER_THREADS" = "4";
        "IPCHECK_CLONE_LIMIT" = "1000";
        "IPCHECK_CLONE_PERIOD" = "1";
        "PINGFREQUENCY" = "3";
# One server, so there is nothing for msgid and time to cross; they are on
# anyway so that what the tests see is what a real network sees.
        "NETWORK_FEATURES" = "TRUE";
        "NETWORK_TIME" = "TRUE";
        "HISTORY_MAX_LIMIT" = "20";
        "HISTORY_EXPORT_DIR" = "/opt/ircu/lib/export";
# Files (doc/readme.files).  The spool and the store are on the same
# filesystem on purpose: moving an upload into the store is a rename(),
# and a rename across filesystems is a copy in the main thread.
        "HTTP_PORT" = "6680";
        "HTTP_UPLOAD_MAX" = "1048576";
        "HTTP_SPOOL_DIR" = "/opt/ircu/lib/spool";
        "FILEHOST_DIR" = "/opt/ircu/lib/files";
        "FILEHOST_BASE_URL" = "http://127.0.0.1:6680/";
        "FILEHOST_RETENTION" = "1";
        "FILEHOST_QUOTA" = "262144";
# The three tags the conversation model is built out of, plus the one
# that marks a body as Markdown.  Deny-all is still the base.
        "CLIENTTAGDENY" = "*,-draft/reply,-draft/react,-typing,-blacknode/format";
};
