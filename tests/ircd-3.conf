General {
        name = "irc-3.example.net";
        vhost = "127.0.0.1";
        description = "Test IRC server";
        numeric = 3;
};

# Every user's visible host is a cipher of its IP under this key; the key
# must be the same on every server of the network (doc/readme.accounting).
Security {
        virtual_host_key = "AbCdEfGhIjKl";
};


Admin {
        Location = "Right Here, Right Now";
        Location = "Testbench IRC server";
        Contact = "root@localhost";
};

Class {
        name = "Server";
        pingfreq = 90 seconds;
        connectfreq = 5 minutes;
        sendq = 9 megabytes;
        maxlinks = 10;
};

Connect { name = "irc.example.net"; host = "127.0.0.1"; port = 7600; password = "password"; class = "Server"; hub; autoconnect = yes; };

Class {
        name = "Local";
        pingfreq = 1 minutes 30 seconds;
        sendq = 160000;
        maxlinks = 100;
};

Client { ip = "127.*"; class = "Local"; };
Operator { local = no; class = "Local"; host = "*@127.*"; password = "$PLAIN$oper"; name = "oper"; };
Port { server = yes; port = 7620; };
Port { port = 7621; };

Features {
        "PPATH" = "ircd-3.pid";
};
